services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_OPTIONS: "--no-network-family-autoselection"

    ports:
      - "3001:3000"
    restart: unless-stopped

# build and run command : docker compose up --build -d
